services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: otp_login
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/otp_login?sslmode=disable
      FRONTEND_URL: http://localhost:5173
      COOKIE_SECURE: "false"
      PORT: "8080"
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  postgres_data:
